<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order — SastaDeal</title>
  <script src="_config.js"></script>
  <style>
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 800;
      font-size: 1.2rem;
    }
    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text-primary);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    .search-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }
    .search-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .search-row input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
    }
    .search-row input:focus {
      border-color: var(--accent);
    }
    .search-row button {
      padding: 13px 24px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
      cursor: pointer;
    }

    /* Order Result Card */
    .result-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 26px;
      box-shadow: var(--shadow-lg);
    }
    .result-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    /* 6-Step Timeline */
    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .step-item {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      position: relative;
    }
    .step-item.done {
      border-color: #22c55e;
      background: rgba(22, 163, 74, 0.08);
    }
    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }
    .step-item.done .step-dot {
      background: #22c55e;
      color: #0f172a;
    }
    .step-title {
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .step-date {
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    /* Details Grid */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .info-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .info-box small {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .info-box strong {
      font-size: 0.95rem;
    }

    .payment-banner {
      background: var(--bg-primary);
      border: 1px solid var(--border-hover);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    @media (max-width: 768px) {
      .timeline-grid { grid-template-columns: repeat(2, 1fr); }
      .search-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <div class="brand-badge">SD</div>
      <span>SastaDeal</span>
    </a>
    <div style="display:flex;gap:10px;">
      <a href="index.html" class="btn">🏠 Home</a>
      <a href="deals.html" class="btn">🔥 Deals</a>
      <button class="btn" onclick="SD.toggleTheme()">🌓</button>
      <a href="login.html" class="btn" style="background:var(--accent);color:var(--accent-text);border:none;">Login</a>
    </div>
  </nav>

  <main class="container">
    <div class="search-card">
      <h1 style="font-size:1.35rem;font-weight:800;">📦 Public Order Tracking</h1>
      <p style="font-size:0.86rem;color:var(--text-secondary);">
        Enter your Amazon, Flipkart, Blinkit, or Myntra <strong>Platform Order ID</strong> to view live 6-step tracking & payout status.
      </p>
      <form class="search-row" onsubmit="handleTrackSubmit(event)">
        <input
          type="text"
          id="trackInput"
          class="mono"
          placeholder="e.g. 404-2759471-7602761 or OD338850088191912100"
          required
        />
        <button type="submit" id="trackBtn">Track Status</button>
      </form>
    </div>

    <div id="trackResultArea"></div>
  </main>

  <script>
    (function autoTrackFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) {
        document.getElementById('trackInput').value = id;
        lookupOrder(id);
      }
    })();

    function handleTrackSubmit(e) {
      e.preventDefault();
      const val = document.getElementById('trackInput').value.trim();
      lookupOrder(val);
    }

    async function lookupOrder(platformOrderId) {
      const area = document.getElementById('trackResultArea');
      if (!platformOrderId) return;

      // Key Business Rule #7: Reject serial OrderNo on public tracker
      if (/^\d{1,6}$/.test(platformOrderId)) {
        area.innerHTML = `
          <div class="result-card" style="border-color:var(--red);text-align:center;">
            <h3 style="color:#ef4444;margin-bottom:6px;">⚠️ Invalid Format: Serial Order No Not Allowed</h3>
            <p style="color:var(--text-secondary);font-size:0.9rem;">
              Public tracking only accepts your <strong>Platform Order ID</strong> (e.g., <span class="mono">404-2759471-7602761</span>), not the serial Order No.
            </p>
          </div>
        `;
        return;
      }

      area.innerHTML = `
        <div class="result-card" style="text-align:center;padding:40px;color:var(--text-secondary);">
          Searching order records for <strong class="mono">${SD.escapeHtml(platformOrderId)}</strong>...
        </div>
      `;

      const res = await SD.api('trackOrder', { platformOrderId: platformOrderId });
      if (!res || !res.success || !res.order) {
        area.innerHTML = `
          <div class="result-card" style="text-align:center;padding:36px;">
            <div style="font-size:2rem;margin-bottom:8px;">🔍</div>
            <h3>Order Not Found</h3>
            <p style="color:var(--text-secondary);font-size:0.9rem;margin-top:4px;">
              ${SD.escapeHtml(res?.error || 'No matching order found. Please check your Platform Order ID.')}
            </p>
          </div>
        `;
        return;
      }

      const o = res.order;
      const isRefunded = String(o.orderStatus || '').toLowerCase() === 'got refund';

      // Days counter since RefundFormDate
      let daysBadge = '';
      if (o.refundFormDate) {
        if (isRefunded && o.refundDate) {
          const totalDays = SD.daysBetween(o.refundFormDate, o.refundDate);
          daysBadge = `<span class="mono" style="font-size:0.78rem;padding:4px 10px;border-radius:999px;background:var(--green-bg);color:#22c55e;">⚡ Refunded in ${totalDays} day(s)</span>`;
        } else {
          const elapsed = SD.daysBetween(o.refundFormDate);
          daysBadge = `<span class="mono" style="font-size:0.78rem;padding:4px 10px;border-radius:999px;background:var(--purple-bg);color:#a855f7;">⏳ ${elapsed} day(s) since Refund Form</span>`;
        }
      }

      const steps = [
        { label: 'Order Placed',     date: o.orderDate,      done: Boolean(o.orderDate) },
        { label: 'Product Received', date: o.deliveryDate,   done: Boolean(o.deliveryDate) },
        { label: 'Reviewed',         date: o.reviewDate,     done: Boolean(o.reviewDate) },
        { label: 'Review Live',      date: o.reviewLiveDate, done: Boolean(o.reviewLiveDate) },
        { label: 'Refund Form',      date: o.refundFormDate, done: Boolean(o.refundFormDate) },
        { label: 'Got Refund',       date: o.refundDate,     done: isRefunded || Boolean(o.refundDate) }
      ];

      area.innerHTML = `
        <div class="result-card">
          <div class="result-top">
            <div>
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;">
                <span class="mono" style="font-weight:800;color:var(--accent);font-size:1rem;">Order #${SD.escapeHtml(o.orderNo)}</span>
                <span class="mono" style="font-size:0.88rem;background:var(--bg-primary);padding:3px 10px;border-radius:6px;border:1px solid var(--border-color);">
                  ${SD.escapeHtml(o.platformOrderId)}
                </span>
                ${SD.statusBadge(o.orderStatus)}
                ${daysBadge}
              </div>
              <h2 style="font-size:1.15rem;font-weight:700;">${SD.escapeHtml(o.productName)}</h2>
            </div>
          </div>

          <!-- 6-Step Progress Timeline -->
          <div class="timeline-grid">
            ${steps.map((st, idx) => `
              <div class="step-item ${st.done ? 'done' : ''}">
                <div class="step-dot">${st.done ? '✓' : (idx + 1)}</div>
                <div class="step-title">${st.label}</div>
                <div class="step-date mono">${st.date ? SD.formatDate(st.date) : 'Pending'}</div>
              </div>
            `).join('')}
          </div>

          <!-- Key Order Info (Mediator Name Hidden as per Spec) -->
          <div class="info-grid">
            <div class="info-box">
              <small>Platform</small>
              <strong>${SD.escapeHtml(o.orderedPlatform)}</strong>
            </div>
            <div class="info-box">
              <small>Reviewer Account</small>
              <strong style="color:var(--cyan)">${SD.escapeHtml(o.accountName)}</strong>
            </div>
            <div class="info-box">
              <small>Order Date</small>
              <strong class="mono">${SD.formatDate(o.orderDate)}</strong>
            </div>
            <div class="info-box">
              <small>Price Paid</small>
              <strong class="mono">${SD.formatCurrency(o.pricePaid)}</strong>
            </div>
            <div class="info-box">
              <small>Buyer Less</small>
              <strong class="mono" style="color:#ef4444">-${SD.formatCurrency(o.buyerLess)}</strong>
            </div>
            <div class="info-box">
              <small>Refund To Get</small>
              <strong class="mono" style="color:#22c55e">${SD.formatCurrency(o.buyerToGet)}</strong>
            </div>
          </div>

          <!-- Payment Settlement Section -->
          <div class="payment-banner">
            <div>
              <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;font-weight:700;">Payout Settlement Status</div>
              <div style="display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap;">
                ${SD.paymentBadge(o.paymentStatus)}
                <span class="mono" style="font-size:0.9rem;">
                  Settled Amount: <strong style="color:#ef4444">${o.buyerActualGot !== null ? SD.formatCurrency(o.buyerActualGot) : '—'}</strong>
                </span>
                ${o.paymentDate ? `<span class="mono" style="font-size:0.82rem;color:var(--text-secondary);">on ${SD.formatDate(o.paymentDate)} (${SD.escapeHtml(o.paymentMethod || 'UPI')})</span>` : ''}
              </div>
            </div>
            <div style="display:flex;gap:8px;">
              ${o.reviewLink ? `<a href="${SD.escapeHtml(o.reviewLink)}" target="_blank" rel="noopener" class="btn">⭐ Review Link</a>` : ''}
              ${o.orderScreenshot ? `<a href="${SD.escapeHtml(o.orderScreenshot)}" target="_blank" rel="noopener" class="btn">🖼️ Screenshot</a>` : ''}
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
